name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Analyse en tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --coverage

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

      - name: Dekking controleren (minimaal 80%)
        run: |
          awk -F: '/^LF:/{lf+=$2} /^LH:/{lh+=$2} END{
            pct = 100*lh/lf; printf "Testdekking: %.1f%% (%d/%d regels)\n", pct, lh, lf;
            if (pct < 80) { print "::error::Testdekking onder 80%"; exit 1 } }' coverage/lcov.info
